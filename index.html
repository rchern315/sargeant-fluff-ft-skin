
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fortnite Furry Ops</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Burbank+Big+Condensed:wght@700&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
    }
    .fortnite-font {
      font-family: 'Inter', sans-serif;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .gradient-bg {
      background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
    }
    .fortnite-blue { color: #00d2ff; }
    .fortnite-purple { color: #9d50bb; }
    .btn-fortnite {
      background: linear-gradient(to right, #9d50bb, #6e48aa);
      transition: all 0.2s ease-in-out;
    }
    .btn-fortnite:hover {
      transform: scale(1.05);
      filter: brightness(1.2);
    }
    .card-rarity-legendary {
      border-top: 4px solid #ff9d00;
      background: linear-gradient(180deg, rgba(255, 157, 0, 0.1) 0%, rgba(15, 23, 42, 1) 100%);
    }
  </style>
